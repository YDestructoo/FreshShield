name: Publish FreshShield v1.0.1 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: CI=1 npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FreshShield.apk

      - name: Create v1.0.1 fix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 FreshShield.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FreshShield v1.0.1" \
            --notes "Fix release: allows Android cleartext HTTP connections for local FreshShield Pico W communication."
